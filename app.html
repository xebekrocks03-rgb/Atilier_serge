<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1f3a">
<title>Atelier Freelance – clients, devis, factures, revenus</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--sf:#fff;--ink:#16202b;--mut:#5d6b7a;--ln:#d8dfe6;--ac:#2f5bea;--acs:#e3eaff;--am:#f2b134;--rd:#d1495b;--gn:#2a8f6a;--bt:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11171e;--sf:#1a222c;--ink:#e8edf2;--mut:#93a1b0;--ln:#2c3744;--ac:#7c9cff;--acs:#22304f;--rd:#ff7a8a;--gn:#4cc79b;--bt:#0d1320;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11171e;--sf:#1a222c;--ink:#e8edf2;--mut:#93a1b0;--ln:#2c3744;--ac:#7c9cff;--acs:#22304f;--rd:#ff7a8a;--gn:#4cc79b;--bt:#0d1320;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
h1,h2{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0;line-height:1.15}
h1{font-size:2rem}h2{font-size:1.15rem}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{background:var(--sf);border-right:1px solid var(--ln);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.logo{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:1.35rem;padding:0 10px 16px}
.logo i{display:inline-block;width:12px;height:12px;background:var(--am);border-radius:3px;margin-right:8px;transform:rotate(12deg)}
nav button{all:unset;cursor:pointer;padding:10px 12px;border-radius:8px;color:var(--mut);font-weight:500;display:flex;justify-content:space-between}
nav button:hover{background:var(--bg)}
nav button[aria-current="page"]{background:var(--acs);color:var(--ac);font-weight:600}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
main{padding:32px clamp(16px,4vw,48px);max-width:980px;width:100%}
.sub{color:var(--mut);margin:6px 0 24px}
.box{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:9px 11px;min-width:0}
input[type=text],input[type=number]{flex:1 1 130px}
.btn{background:var(--ac);color:var(--bt);border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer}
.btn.alt{background:var(--sf);color:var(--ink);border:1px solid var(--ln)}
.btn.sm{padding:5px 10px;font-size:.88rem;font-weight:500}
.btn.ghost{background:transparent;color:var(--mut);border:1px solid var(--ln);padding:5px 10px;font-weight:500}
.btn.ghost:hover{color:var(--rd);border-color:var(--rd)}
.item{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--ln);flex-wrap:wrap}
.item:last-child{border:0}
.t{flex:1 1 180px;min-width:0;overflow-wrap:anywhere}
.done .t{text-decoration:line-through;color:var(--mut)}
.tag{font-size:.8rem;padding:2px 9px;border-radius:99px;background:var(--acs);color:var(--ac);font-weight:600}
.small{color:var(--mut);font-size:.88rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:16px}
.stat b{display:block;font:700 1.7rem "Bricolage Grotesque",sans-serif}
.bar{height:12px;background:var(--bg);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--gn);border-radius:99px}
.pos{color:var(--gn)}.neg{color:var(--rd)}
.empty{color:var(--mut);padding:18px 4px}
.lines{display:grid;grid-template-columns:3fr 1fr 1fr;gap:8px;width:100%}
.lines input{width:100%}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.col{background:var(--bg);border-radius:10px;padding:10px}
.col h2{font-size:.95rem;margin-bottom:8px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:9px;margin-bottom:8px}
@media (max-width:720px){.app{grid-template-columns:1fr}
nav{position:static;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--ln);padding:10px}
.logo{display:none}nav button{white-space:nowrap;gap:8px}}
.pay{max-width:920px;margin:0 auto;padding:28px clamp(16px,4vw,32px)}
.pay-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.logo2{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:1.25rem}
.logo2 i{display:inline-block;width:12px;height:12px;background:var(--am);border-radius:3px;margin-right:8px;transform:rotate(12deg)}
.pay-hero{text-align:center;margin-bottom:28px}
.pay-hero .sub{max-width:520px;margin:10px auto 0;overflow-wrap:anywhere}
.badge{display:inline-block;background:var(--acs);color:var(--gn);font-weight:600;border-radius:99px;padding:4px 14px;margin-bottom:12px}
.pay-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:16px;align-items:start}
.plan{background:var(--sf);border:1px solid var(--ln);border-top:6px solid var(--ac);border-radius:12px;padding:22px}
.price{margin:10px 0 14px}.price b{font:700 2.4rem "Bricolage Grotesque",sans-serif;color:var(--ac)}.price span{color:var(--mut)}
.feat{list-style:none;margin:0;padding:0}.feat li{padding:7px 0 7px 28px;position:relative;border-top:1px solid var(--ln)}
.feat li::before{content:"✓";position:absolute;left:4px;color:var(--gn);font-weight:700}
.st{margin:10px 0 16px;padding-left:20px}.st li{margin-bottom:10px}
.num{display:inline-block;font:700 1.25rem ui-monospace,monospace;background:var(--acs);color:var(--ac);padding:3px 10px;border-radius:8px;margin:4px 6px 4px 0}
@media (max-width:720px){.pay-grid{grid-template-columns:1fr}}
.app.solo main{max-width:none;padding:0}
.auth{display:grid;grid-template-columns:1.05fr 1fr;min-height:100vh}
.brand{position:relative;overflow:hidden;background:#14213d;color:#fff;padding:40px clamp(24px,5vw,64px);display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.brand h1{font-size:clamp(1.9rem,3.6vw,2.8rem);max-width:520px;color:#fff}
.logo3{font:700 1.3rem "Bricolage Grotesque",sans-serif}
.logo3 i{display:inline-block;width:12px;height:12px;background:var(--am);border-radius:3px;margin-right:8px;transform:rotate(12deg)}
.bl{list-style:none;padding:0;margin:26px 0 0;display:grid;gap:14px;max-width:460px}
.bl li{padding-left:22px;position:relative;color:#c9d3e6}
.bl li::before{content:"";position:absolute;left:0;top:.6em;width:8px;height:8px;background:var(--am);border-radius:2px;transform:rotate(12deg)}
.bl b{color:#fff}
.bsm{color:#9fb0cf;font-size:.92rem;margin:0;position:relative}
.sh{position:absolute;border-radius:28px;pointer-events:none}
.s1{width:260px;height:260px;background:var(--am);opacity:.16;right:-90px;top:-70px;transform:rotate(18deg)}
.s2{width:180px;height:180px;border:3px solid #7c9cff;opacity:.3;right:12%;bottom:-60px;transform:rotate(-14deg)}
.brand>*:not(.sh){position:relative}
.fside{display:flex;align-items:center;justify-content:center;padding:32px clamp(16px,4vw,48px)}
.fcard{width:100%;max-width:420px}
.fcard h2{font-size:1.7rem;margin-bottom:6px}
.fcard input{width:100%;padding:12px 14px;font-size:1rem}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:4px;margin-bottom:26px}
.tabs button{border:0;background:none;padding:10px;border-radius:7px;font-weight:600;color:var(--mut);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--sf);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.lb{display:block;font-weight:600;margin:18px 0 6px;font-size:.92rem}
.pwrap{position:relative}.pwrap input{padding-right:92px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--ac);font-weight:600;cursor:pointer;padding:8px}
.btn.big{width:100%;margin-top:22px;padding:13px;font-size:1.02rem}
.msg{margin:14px 0 0;padding:10px 12px;border-left:4px solid var(--am);background:var(--bg);border-radius:6px;font-size:.92rem;overflow-wrap:anywhere}
.plan{position:relative}
.ribbon{position:absolute;top:16px;right:16px;background:var(--am);color:#16202b;font-weight:700;font-size:.78rem;padding:3px 10px;border-radius:99px}
.brand{background:#14213d;justify-content:flex-start}

.brand>*:not(.bphoto){z-index:1}
.brand>div:not(.bphoto){margin-top:auto}
.sh{display:none}
@media (max-width:820px){.auth{grid-template-columns:1fr}.brand{padding:26px 22px;gap:16px}.bl,.bsm{display:none}.brand h1{font-size:1.55rem}}
@media (max-width:820px){
.brand{min-height:0;padding:0 22px 26px;gap:14px}
.brand>.bphoto{position:relative;inset:auto;height:270px;margin:0 -22px;background-position:center 40%}
.brand>.bphoto::after{background:linear-gradient(180deg,rgba(20,33,61,.5) 0%,rgba(20,33,61,0) 28%,rgba(20,33,61,0) 88%,#14213d 100%)}
.brand>.logo3{position:absolute;top:18px;left:22px}
.brand h1{display:block;font-size:1.5rem}
.bl{display:grid;margin-top:14px}
.bsm{display:block}
}
.app.solo{grid-template-columns:1fr}.app.solo nav{display:none}

/* ===== Design premium ===== */
:root{--bg:#f3f5fa;--sf:#fff;--ink:#0f1a2b;--mut:#64738a;--ln:#e3e8f1;--ac:#2f5bea;--acs:#e8eeff;--am:#f5b335;--amt:#8a5a00;--rd:#e0455a;--gn:#1f9d6e;--sh:0 1px 2px rgba(15,26,43,.05),0 8px 24px rgba(15,26,43,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1420;--sf:#151f2e;--ink:#e9eef6;--mut:#8fa0b5;--ln:#243247;--ac:#7c9cff;--acs:#1d2c4d;--amt:#f5b335;--rd:#ff7a8a;--gn:#4cc79b;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}}
:root[data-theme="dark"]{--bg:#0d1420;--sf:#151f2e;--ink:#e9eef6;--mut:#8fa0b5;--ln:#243247;--ac:#7c9cff;--acs:#1d2c4d;--amt:#f5b335;--rd:#ff7a8a;--gn:#4cc79b;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}
h1{font-size:2.1rem;letter-spacing:-.02em}
main{padding-top:36px}
@media (min-width:721px){.app{grid-template-columns:248px 1fr}}
nav{background:linear-gradient(180deg,#14213d 0%,#0d1830 100%);border-right:0;color:#fff}
nav .logo{color:#fff;font-size:1.45rem;padding:4px 10px 22px}
nav button{display:flex;align-items:center;justify-content:flex-start;gap:12px;color:#aebbd6;padding:11px 14px;border-radius:12px;position:relative}
nav button:hover{background:rgba(255,255,255,.07);color:#fff}
nav button[aria-current="page"]{background:linear-gradient(90deg,rgba(245,179,53,.2),rgba(245,179,53,.05));color:#fff}
nav button[aria-current="page"]::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:4px;background:var(--am)}
nav button[aria-current="page"] .ni{color:var(--am)}
.ni{display:grid;place-items:center}
.cnt{margin-left:auto;background:rgba(255,255,255,.14);color:#fff;font-size:.78rem;font-weight:600;border-radius:99px;padding:1px 9px}
.who{margin-top:auto;display:flex;gap:10px;align-items:center;padding:12px;border-radius:14px;background:rgba(255,255,255,.07);min-width:0}
.who>div{min-width:0}.who b{display:block;font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who span:not(.av){font-size:.76rem;color:#7fe0b6}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#2f5bea,#8a4dff);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.av.lg{width:52px;height:52px;font-size:1.3rem}
.hello{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.btn{background:linear-gradient(135deg,#3b66f0,#2543c4);color:#fff;box-shadow:0 6px 16px rgba(47,91,234,.3);border-radius:10px}
.btn.alt,.btn.ghost{box-shadow:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.alt):not(.ghost){background:var(--ac);color:var(--bt);box-shadow:none}}
:root[data-theme="dark"] .btn:not(.alt):not(.ghost){background:var(--ac);color:var(--bt);box-shadow:none}
.box{border-radius:16px;box-shadow:var(--sh)}
.box h2{margin-bottom:6px}
.item{border-radius:10px;padding:12px 10px}
.item:hover{background:var(--bg)}
input[type=checkbox]{accent-color:var(--ac);width:18px;height:18px}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#14213d 0%,#23408e 62%,#2f5bea 130%);color:#fff;border-radius:22px;padding:28px;margin-bottom:18px;box-shadow:0 16px 36px rgba(31,64,160,.28)}
.hero::after{content:"";position:absolute;right:-50px;top:-60px;width:210px;height:210px;border-radius:36px;background:var(--am);opacity:.2;transform:rotate(18deg)}
.hero>*{position:relative;z-index:1}
.eyebrow{display:block;text-transform:uppercase;letter-spacing:.12em;font-size:.76rem;color:#b9c7ea;font-weight:600}
.big{font:700 clamp(2rem,6vw,3rem) "Bricolage Grotesque",sans-serif;margin:6px 0 2px;overflow-wrap:anywhere}
.hs{color:#c9d5f2;font-size:.95rem}
.hero .bar{height:14px;background:rgba(255,255,255,.18);margin:18px 0 8px}
.hero .bar i{background:linear-gradient(90deg,#f5b335,#ffd98a)}
.hrow{display:flex;justify-content:space-between;color:#dce5fb;font-size:.92rem}
.stat{border-radius:16px;box-shadow:var(--sh);position:relative;overflow:hidden;padding-left:22px}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--ac)}
.s-gn::before{background:var(--gn)}.s-am::before{background:var(--am)}
.stat b{font-size:1.5rem;overflow-wrap:anywhere}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.two .box{margin-bottom:0}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.late{color:var(--rd);font-weight:600}
.chip{font-size:.7rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:4px 10px;border-radius:7px;flex:none}
.chip.devis{background:var(--acs);color:var(--ac)}
.chip.facture{background:rgba(245,179,53,.2);color:var(--amt)}
.stt{font-weight:600;border-radius:99px;padding:6px 12px}
.stt.s-b{color:var(--mut)}
.stt.s-e{background:rgba(245,179,53,.18);color:var(--amt);border-color:transparent}
.stt.s-p{background:rgba(31,157,110,.16);color:var(--gn);border-color:transparent}
.col{border-radius:16px;border-top:5px solid var(--ln);padding:12px}
.c0{border-top-color:#8fa1bd}.c1{border-top-color:var(--am)}.c2{border-top-color:var(--ac)}.c3{border-top-color:var(--gn)}
.col h2{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.col h2 em{font-style:normal;background:var(--sf);border-radius:99px;padding:0 10px;font-size:.82rem;color:var(--mut)}
.card{border-radius:12px;box-shadow:var(--sh);padding:12px}
.cl{display:flex;gap:10px;align-items:center}
.cl b{overflow-wrap:anywhere}
.acct{display:flex;align-items:center;gap:14px}
.tag.ok{background:rgba(31,157,110,.16);color:var(--gn)}
.plan{box-shadow:var(--sh)}
@media (max-width:720px){.who{display:none}nav button{padding:9px 12px}main{padding-top:20px}h1{font-size:1.7rem}}
@media (min-width:821px) and (max-height:780px){.bl{display:none}}

/* ===== Liquid Glass (verre liquide) ===== */
:root{--bg:#e7eefc;--ink:#0f1a2b;--mut:#51627b;--ln:rgba(110,130,175,.22);--acs:rgba(47,91,234,.12);
--gl:linear-gradient(135deg,rgba(255,255,255,.68) 0%,rgba(255,255,255,.30) 100%);--gl2:rgba(255,255,255,.52);--gb:rgba(255,255,255,.75);
--hi:rgba(255,255,255,.9);--hov:rgba(255,255,255,.45);--act:rgba(255,255,255,.82);
--gsh:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.25),0 14px 36px rgba(40,60,120,.16);
--cs:0 6px 16px rgba(40,60,120,.12);--bf:blur(24px) saturate(185%);

html{background:var(--bg)}
body{background:transparent;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--bgi);pointer-events:none}
.btn,nav button,input,select,textarea,.card,.item{transition:background .2s,box-shadow .2s,transform .15s,border-color .2s}
/* surfaces en verre */
.box,.stat,.col,.plan,.fcard{background:var(--gl);border:1px solid var(--gb);box-shadow:var(--gsh);-webkit-backdrop-filter:var(--bf);backdrop-filter:var(--bf)}
.box{border-radius:26px;padding:20px}
.stat{border-radius:22px}
.plan{border-top:6px solid var(--ac);border-radius:28px}
.col{border-radius:24px;border-top:5px solid var(--gb);background:var(--gl2)}
.c0{border-top-color:#8fa1bd}.c1{border-top-color:var(--am)}.c2{border-top-color:var(--ac)}.c3{border-top-color:var(--gn)}
.col h2 em{background:var(--gl2);border:1px solid var(--gb)}
.card{background:var(--gl2);border:1px solid var(--gb);border-radius:18px;box-shadow:inset 0 1px 0 var(--hi),var(--cs)}
.item:hover{background:var(--hov)}
.msg{background:var(--gl2);border:1px solid var(--gb);border-left:4px solid var(--am);border-radius:14px}
.bar{background:rgba(110,130,175,.22);box-shadow:inset 0 1px 2px rgba(20,40,90,.15)}
.bar i{background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0) 60%),var(--gn);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.hero .bar i{background:linear-gradient(180deg,rgba(255,255,255,.5),rgba(255,255,255,0) 60%),linear-gradient(90deg,#f5b335,#ffd98a)}
/* champs */
input,select,textarea{background:var(--gl2);border:1px solid var(--gb);border-radius:14px;box-shadow:inset 0 1px 3px rgba(20,40,90,.10)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 4px rgba(47,91,234,.20)}
input[type=checkbox]{background:none;border:0;box-shadow:none;padding:0;border-radius:5px}
.fcard input{border-radius:16px}
/* boutons */
.btn{border-radius:999px;padding:10px 18px}
.btn.sm,.btn.ghost{padding:6px 12px}
.btn:not(.alt):not(.ghost){background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0) 55%),linear-gradient(135deg,#4f7bff,#2f5bea)!important;color:#fff!important;border:1px solid rgba(255,255,255,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.65),inset 0 -1px 0 rgba(0,0,30,.12),0 10px 24px rgba(47,91,234,.38)!important}
.btn.alt,.btn.ghost{background:var(--gl2);color:var(--ink);border:1px solid var(--gb);box-shadow:inset 0 1px 0 var(--hi),var(--cs)}
.btn.ghost{color:var(--mut)}
.btn.ghost:hover{color:var(--rd);border-color:var(--rd)}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.97)}
.stt.s-b,.btn.stt.s-b{color:var(--mut)}
.stt.s-e,.btn.stt.s-e{background:rgba(245,179,53,.24);color:var(--amt);border-color:rgba(245,179,53,.45)}
.stt.s-p,.btn.stt.s-p{background:rgba(31,157,110,.20);color:var(--gn);border-color:rgba(31,157,110,.45)}
/* menu latéral flottant */
nav{background:var(--gl);-webkit-backdrop-filter:var(--bf);backdrop-filter:var(--bf);border:1px solid var(--gb);box-shadow:var(--gsh);color:var(--ink);margin:14px 0 14px 14px;top:14px;height:calc(100vh - 28px);border-radius:32px}
nav .logo{color:var(--ink)}
nav button{color:var(--mut);border-radius:999px}
nav button:hover{background:var(--hov);color:var(--ink)}
nav button[aria-current="page"]{background:var(--act);color:var(--ink);box-shadow:inset 0 1px 0 var(--hi),var(--cs)}
nav button[aria-current="page"]::before{display:none}
nav button[aria-current="page"] .ni{color:var(--ac)}
.cnt{background:var(--acs);color:var(--ac)}
.who{background:var(--gl2);border:1px solid var(--gb);color:var(--ink)}
.who span:not(.av){color:var(--gn)}
/* carte principale */
.hero{border-radius:30px;border:1px solid rgba(255,255,255,.38);background:radial-gradient(120% 90% at 0% 0%,rgba(255,255,255,.30),transparent 55%),linear-gradient(135deg,#1b3585 0%,#2f5bea 62%,#7a5cff 125%);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 20px 44px rgba(47,91,234,.32)}

/* ===== Facture premium ===== */
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
.sheet{position:relative;max-width:820px;margin:0 auto 30px;background:#fff;color:#14213d;border-radius:22px;overflow:hidden;box-shadow:0 26px 70px rgba(20,33,61,.24);font-size:.95rem;line-height:1.45}
.sh-bar{height:10px;background:linear-gradient(90deg,#14213d,#2f5bea 70%,#f5b335)}
.sh-in{padding:clamp(22px,5vw,46px)}
.sh-head{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-start}

.sh-logo{max-height:64px;max-width:150px;object-fit:contain}

.sh-no{font-weight:700;margin-top:4px}
.sh-dates{display:grid;grid-template-columns:auto auto;gap:2px 14px;justify-content:end;margin-top:8px;font-size:.88rem}
.sh-dates span,.sh-m{color:#6b7a90}
.sh-parties{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:30px 0 24px}
.sh-card{background:#f4f7fc;border:1px solid #e6ebf3;border-radius:14px;padding:14px 16px;overflow-wrap:anywhere}
.sh-card small{display:block;text-transform:uppercase;letter-spacing:.12em;font-size:.7rem;font-weight:700;color:#2f5bea;margin-bottom:6px}
.sh-t{width:100%;border-collapse:separate;border-spacing:0;font-size:.93rem}
.sh-t th{background:#14213d;color:#fff;text-align:left;padding:11px 14px;font-size:.74rem;letter-spacing:.09em;text-transform:uppercase}
.sh-t th:first-child{border-radius:10px 0 0 10px}.sh-t th:last-child{border-radius:0 10px 10px 0}
.sh-t td{padding:12px 14px;border-bottom:1px solid #e6ebf3;vertical-align:top;overflow-wrap:anywhere}
.sh-t tbody tr:nth-child(even) td{background:#fafbfe}
.sh-t .r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.sh-sum{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:18px;flex-wrap:wrap}
.sh-tot{width:min(100%,340px);margin-left:auto}
.sh-tot div{display:flex;justify-content:space-between;gap:12px;padding:6px 4px;color:#46556b}

.sh-info{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}

.sh-foot b{display:block;color:#14213d;font-size:.95rem;margin-bottom:4px}
.stamp{transform:rotate(-8deg);border:4px solid #1f9d6e;color:#1f9d6e;font:800 1.6rem Figtree,sans-serif;letter-spacing:.14em;padding:6px 18px;border-radius:12px;opacity:.85;text-align:center;margin-left:6px}
.stamp small{display:block;font-size:.62rem;letter-spacing:.08em;font-weight:700}
.sh-sub{display:none;color:#6b7a90;font-size:.8rem;margin-top:2px}
main{min-width:0}
.sheet{max-width:100%}
.sh-t tr,.sh-tot,.sh-info,.sh-foot,.sh-parties{break-inside:avoid}
@media (max-width:620px){.sh-title{text-align:left}.sh-dates{justify-content:start}.sh-parties,.sh-info{grid-template-columns:1fr}.hm{display:none}.sh-sub{display:block}.sh-sum{flex-direction:column;align-items:stretch}.stamp{align-self:flex-start}.sh-t th,.sh-t td{padding:9px 8px;font-size:.85rem}}

/* ===== Courbe d'activité ===== */
.ch-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.ch-kpi{display:flex;gap:8px;flex-wrap:wrap}
.ch-chip{background:var(--gl2);border:1px solid var(--gb);border-radius:999px;padding:4px 12px;font-size:.84rem;color:var(--mut)}
.ch-chip b{color:var(--ink)}
.ch-chip.ch-up b{color:var(--gn)}.ch-chip.ch-dn b{color:var(--rd)}
.chart{position:relative;height:210px;margin:40px 8px 0}
.chart svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;color:var(--ac)}
.dot{position:absolute;width:14px;height:14px;margin:0 0 -7px -7px;border-radius:50%;background:#fff;border:3px solid var(--ac);box-shadow:0 2px 8px rgba(47,91,234,.4);outline:0;cursor:default}
.dot.cur{width:18px;height:18px;margin:0 0 -9px -9px;border-color:var(--am)}
.dot:focus-visible{box-shadow:0 0 0 4px rgba(47,91,234,.3)}
.tip{display:none;position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);white-space:nowrap;font-style:normal;font-size:.78rem;font-weight:600;padding:5px 10px;border-radius:10px;background:#14213d;color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.25);z-index:3}
.dot.cur .tip,.dot:hover .tip,.dot:focus .tip{display:block}
.dot.f .tip{left:-6px;transform:none}.dot.e .tip{left:auto;right:-6px;transform:none}
.dot:hover,.dot:focus{z-index:4}
.ch-lab{display:grid;margin:12px 8px 0;text-align:center;font-size:.82rem;color:var(--mut);text-transform:capitalize}
.glab{position:absolute;left:0;font-size:.72rem;font-weight:600;color:var(--amt);transform:translateY(-130%)}
.ch-empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--mut);padding:0 20px;pointer-events:none}

.sumbox .gt{margin-top:6px;padding-top:10px;border-top:1px solid var(--gb);font-weight:700;color:var(--ink);font-size:1.08rem}
.sumbox .gt b{color:var(--ac)}
.sheet{border-radius:26px;border:1px solid #dcebf5}
.sheet::before{content:"";position:absolute;right:-90px;top:-110px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(111,200,245,.38),transparent 68%);pointer-events:none}
.sh-bar{height:12px}
.sh-head{padding-bottom:24px;border-bottom:1px solid #dcebf5}
.sheet .sh-title h2{font-size:2.3rem;letter-spacing:.2em;color:#1d8bd0;background:linear-gradient(135deg,#0a1f3a,#1d8bd0 60%,#5cc3f0);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sh-no{font-size:1.02rem;letter-spacing:.03em}
.sh-card{border-radius:16px;background:linear-gradient(160deg,#f6fbff,#eaf4fb);padding:16px 18px;line-height:1.55}
.sh-obj{margin:0 0 20px;padding:14px 18px;border-radius:16px;border:1px solid #cfe6f5;background:#fff}
.sh-obj small{display:block;font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#1d8bd0;margin-bottom:3px}
.sh-obj b{font:700 1.08rem "Bricolage Grotesque",Figtree,sans-serif;color:#0a1f3a}
.sh-t th{background:#0c2d4f}
.sh-t tbody tr:nth-child(even) td{background:#f6fbff}
.sh-tot .g{border-radius:16px;padding:16px 18px;font-size:1.18rem;box-shadow:0 10px 24px rgba(15,90,146,.28)}
.sh-sign{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:30px;break-inside:avoid}
.sh-sign div{height:104px;border:1px dashed #9fcbe6;border-radius:16px;padding:12px 16px}
.sh-sign small{font-size:.74rem;font-weight:700;letter-spacing:.06em;color:#4d657d}
@media (max-width:620px){.sh-sign{grid-template-columns:1fr}}

.trial{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 18px;padding:10px 12px 10px 20px;border-radius:999px;background:var(--gl);border:1px solid var(--gb);box-shadow:var(--gsh);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%)}
.trial b{color:var(--ac)}

<script>
const SB_URL="https://pitjolrfodfbxojkhvre.supabase.co",SB_KEY="sb_publishable_Nw2-Jj_QVqX864Gc5Rlxyw_jEN0RUIG";
const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:"atelier-session"}});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(x){}

function save(){clearTimeout(tm);tm=setTimeout(async()=>{if(!user||!actif||!dataOk)return;try{const{error}=await sb.from("donnees").upsert({user_id:user.id,data:S,updated_at:new Date().toISOString()});if(error)console.error(error)}catch(x){console.error(x)}},600)}
function vAuth(){const up=authMode==="up";
return `<div class="auth">
<aside class="brand"><div class="bphoto"></div><span class="logo3"><i></i>Atelier Freelance</span>
<div><h1>Votre activité de freelance, enfin bien rangée.</h1>

${msg?`<p class="msg" role="status">${esc(msg)}</p>`:""}</form>

async function loadUser(session){

      actif=paid||trialLeft()>0;

  }

setTimeout(()=>{if(!ready)sb.auth.getSession().then(({data})=>{if(!ready)loadUser(data.session)}).catch(()=>{ready=true;render()})},1500);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

const money=n=>n.toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" "+esc(S.cur);
const sub=d=>d.lines.reduce((a,l)=>a+l.q*l.p,0);
const total=d=>sub(d)*(1-(d.rem||0)/100);
const fmN=n=>(Math.round(n*100)/100).toLocaleString("fr-FR",{maximumFractionDigits:2})+" "+esc(S.cur);

const IC={accueil:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',clients:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.5c2.6.2 4.2 1.8 4.5 4.5"/>',docs:'<path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/>',taches:'<rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M8 12.5l3 3 5-6"/>',abo:'<rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 10h19M6.5 15h4"/>',reglages:'<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/>'};
const ic=k=>`<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]||""}</svg>`;

function nav(){

function trialBanner(){const n=trialLeft();if(paid||!n)return"";return `<div class="trial noprint"><span><b>Essai gratuit</b> · il vous reste ${n} jour${n>1?"s":""}</span><button class="btn sm" data-v="abo">S’abonner</button></div>`}
function render(){

  app.classList.toggle("solo",gate!==null);
  if(gate!==null){mn.innerHTML=gate;return}
  nav();mn.innerHTML=trialBanner()+({accueil:vAccueil,clients:vClients,docs:vDocs,apercu:vApercu,taches:vTaches,abo:vAbo,reglages:vReglages})[view]()}

function revChart(){
  const n=6,now=new Date(),fa=S.docs.filter(d=>d.type==="facture"&&d.st==="payé");
  const ms=[];for(let k=n-1;k>=0;k--){const x=new Date(now.getFullYear(),now.getMonth()-k,1);const key=x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0");ms.push({key,l:x.toLocaleDateString("fr-FR",{month:"short"}).replace(".",""),v:fa.filter(d=>(d.paid||d.date||"").slice(0,7)===key).reduce((a,d)=>a+total(d),0)})}
  const vals=ms.map(m=>m.v),mx=Math.max(...vals,S.goal>0?S.goal:0,1),sum=vals.reduce((a,b)=>a+b,0);
  const yy=v=>94-v/mx*84,xx=i=>(i+.5)/n*100;
  let d="M "+xx(0)+" "+yy(vals[0]);for(let i=1;i<n;i++){const xm=(xx(i-1)+xx(i))/2;d+=` C ${xm} ${yy(vals[i-1])}, ${xm} ${yy(vals[i])}, ${xx(i)} ${yy(vals[i])}`}
  const area=d+` L ${xx(n-1)} 100 L ${xx(0)} 100 Z`;
  const cur=vals[n-1],prev=vals[n-2];
  const chip=prev>0?(()=>{const p=Math.round((cur-prev)/prev*100);return `<span class="ch-chip ${p>=0?"ch-up":"ch-dn"}"><b>${p>=0?"▲ +":"▼ "}${p} %</b> vs mois dernier</span>`})():(cur>0?'<span class="ch-chip ch-up"><b>▲</b> Premier revenu du mois</span>':"");
  const gy=S.goal>0?yy(S.goal):null;
  const dots=ms.map((m,i)=>`<span class="dot${i===n-1?" cur":""}${i===0?" f":""}${i===n-1?" e":""}" tabindex="0" style="left:${xx(i)}%;bottom:${100-yy(m.v)}%"><i class="tip">${esc(m.l)} · ${money(m.v)}</i></span>`).join("");
  const alt="Revenus encaissés sur les 6 derniers mois : "+ms.map(m=>m.l+" "+Math.round(m.v)).join(", ");
  return `<div class="box chartbox"><div class="ch-head"><div><h2>Évolution de l’activité</h2><span class="small">Revenus encaissés, 6 derniers mois</span></div><div class="ch-kpi"><span class="ch-chip">Total : <b>${money(sum)}</b></span>${chip}</div></div>
  <div class="chart" role="img" aria-label="${esc(alt)}"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="gArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity=".38"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs>
  ${[10,52,94].map(y=>`<line x1="0" x2="100" y1="${y}" y2="${y}" style="stroke:var(--ln)" stroke-width="1" vector-effect="non-scaling-stroke"/>`).join("")}
  ${gy!==null?`<line x1="0" x2="100" y1="${gy}" y2="${gy}" style="stroke:var(--am)" stroke-width="1.5" stroke-dasharray="6 5" vector-effect="non-scaling-stroke"/>`:""}
  <path d="${area}" fill="url(#gArea)"/><path d="${d}" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>
  ${gy!==null?`<span class="glab" style="top:${gy}%">Objectif ${money(S.goal)}</span>`:""}${dots}${sum===0?'<div class="ch-empty">Vos revenus apparaîtront ici dès votre première facture payée.</div>':""}</div>
  <div class="ch-lab" style="grid-template-columns:repeat(${n},1fr)">${ms.map(m=>`<span>${esc(m.l)}</span>`).join("")}</div></div>`;
}
function vAccueil(){
  const m=today().slice(0,7),fa=S.docs.filter(d=>d.type==="facture");
  const rev=fa.filter(d=>d.st==="payé"&&(d.paid||"").slice(0,7)===m).reduce((a,d)=>a+total(d),0);
  const att=fa.filter(d=>d.st==="envoyé").reduce((a,d)=>a+total(d),0);
  const act=S.clients.filter(c=>c.stage==="En cours").length;
  const pct=S.goal>0?Math.min(100,Math.round(rev/S.goal*100)):0;
  const due=fa.filter(d=>d.st==="envoyé");
  const tk=S.taches.filter(t=>!t.ok).sort((a,b)=>(a.date||"9")>(b.date||"9")?1:-1).slice(0,5);
  return `<div class="hello"><div><h1>Tableau de bord</h1><p class="sub">Votre activité de freelance en un coup d’œil.</p></div><button class="btn" data-v="docs">+ Nouveau devis</button></div>
  <section class="hero"><span class="eyebrow">Objectif du mois</span><div class="big">${money(rev)}</div><span class="hs">encaissés sur un objectif de ${money(S.goal)}</span>
  <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div><div class="hrow"><b>${pct} %</b><span>Reste ${money(Math.max(0,S.goal-rev))}</span></div></section>
  <div class="stats"><div class="stat s-gn"><b>${money(rev)}</b>encaissé ce mois-ci</div><div class="stat s-am"><b>${money(att)}</b>en attente de paiement</div><div class="stat s-ac"><b>${act}</b>mission${act>1?"s":""} en cours</div></div>
  ${revChart()}
  <div class="two"><div class="box"><h2>Factures à relancer</h2>${due.length?due.map(d=>`<div class="item"><span class="t"><b>${esc(d.num)}</b> · ${esc(cname(d.cid))}</span><b>${money(ttc(d))}</b><button class="btn sm" data-paid="${d.id}">Marquer payée</button></div>`).join(""):'<div class="empty">Aucune facture en attente. Créez-en une dans « Devis &amp; factures ».</div>'}</div>
  <div class="box"><h2>Tâches à venir</h2>${tk.length?tk.map(t=>`<div class="item"><span class="t">${esc(t.txt)}</span>${t.date?`<span class="small ${t.date<today()?"late":""}">${esc(t.date)}</span>`:""}</div>`).join(""):'<div class="empty">Aucune tâche en cours.</div>'}</div></div>`;
}

function vClients(){
  return `<h1>Clients</h1><p class="sub">Suivez chaque contact de la prospection à la fin de mission.</p>
  <form class="box" data-form="client"><div class="cform"><input type="text" name="nom" placeholder="Nom ou entreprise" required aria-label="Nom ou entreprise" style="grid-column:1/-1"><input type="email" name="mail" placeholder="E-mail" aria-label="E-mail"><input type="tel" name="tel" placeholder="Téléphone" aria-label="Téléphone"><input type="text" name="adr" placeholder="Adresse (rue, ville, pays)" aria-label="Adresse"><input type="text" name="nif" placeholder="N° d’identification fiscale (optionnel)" aria-label="Numéro d’identification fiscale"><button class="btn">Ajouter le client</button></div></form>
  ${S.clients.length?`<div class="cols">${STAGES.map((st,i)=>{const l=S.clients.filter(c=>c.stage===st);return `<div class="col c${i}"><h2><span>${st}</span><em>${l.length}</em></h2>${l.map(c=>`<div class="card"><div class="cl"><span class="av">${ini(c.nom)}</span><div><b>${esc(c.nom)}</b><br><span class="small">${esc(c.info)}</span></div></div><div class="row" style="margin-top:10px"><select data-stage="${c.id}" aria-label="Étape">${STAGES.map(x=>`<option ${x===st?"selected":""}>${x}</option>`).join("")}</select><button class="btn ghost" data-del="clients:${c.id}" aria-label="Supprimer">✕</button></div></div>`).join("")}</div>`}).join("")}</div>`:'<div class="empty">Aucun client pour l’instant. Ajoutez votre premier prospect.</div>'}`;
}

const U=["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize","dix-sept","dix-huit","dix-neuf"],TN=["","","vingt","trente","quarante","cinquante","soixante"];
function w100(n,f){if(n<20)return U[n];if(n<70){const t=Math.floor(n/10),u=n%10;return TN[t]+(u===0?"":u===1?" et un":"-"+U[u])}if(n<80)return n===71?"soixante et onze":"soixante-"+U[n-60];if(n===80)return f?"quatre-vingts":"quatre-vingt";return "quatre-vingt-"+U[n-80]}
function w1000(n,f){const h=Math.floor(n/100),r=n%100;let s="";if(h>0)s=h===1?"cent":U[h]+" cent"+(r===0&&f&&h>1?"s":"");if(r>0)s+=(s?" ":"")+w100(r,f);return s}
function nbW(n){if(n===0)return "zéro";const b=Math.floor(n/1e9),m=Math.floor(n%1e9/1e6),k=Math.floor(n%1e6/1e3),r=n%1e3,p=[];if(b)p.push(b===1?"un milliard":w1000(b,false)+" milliards");if(m)p.push(m===1?"un million":w1000(m,false)+" millions");if(k)p.push(k===1?"mille":w1000(k,false)+" mille");if(r)p.push(w1000(r,true));return p.join(" ")}
function curW(n){const c=(S.cur||"").trim();if(/^(f\s?cfa|fcfa|xof|cfa|f)$/i.test(c))return n>=2?"francs CFA":"franc CFA";if(/^(€|eur|euros?)$/i.test(c))return n>=2?"euros":"euro";if(/^(\$|usd)$/i.test(c))return n>=2?"dollars":"dollar";return c}
function inWords(v){const x=Math.round(v*100)/100,e=Math.floor(x),ct=Math.round((x-e)*100);let s=nbW(e)+(e>=1e6&&e%1e6===0?" de":"")+" "+curW(e);if(ct>0)s+=" et "+nbW(ct)+" centime"+(ct>1?"s":"");return s.charAt(0).toUpperCase()+s.slice(1)}
function addDays(iso,n){const x=new Date(iso+"T12:00:00");x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}
function nextNum(type){const p=type==="devis"?"DV-":"FA-";const mx=S.docs.filter(x=>x.type===type).reduce((a,x)=>Math.max(a,parseInt((String(x.num).match(/(\d+)\s*$/)||[0,0])[1],10)||0),0);return p+String(mx+1).padStart(3,"0")}
const ttc=d=>total(d)*(1+(d.tva||0)/100);
const fdate=iso=>iso?new Date(iso+"T12:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"}):"";
function readLogo(f){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,280/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext("2d").drawImage(im,0,0,c.width,c.height);S.logo=c.toDataURL("image/png");save();render()};im.src=r.result};r.readAsDataURL(f)}
function vApercu(){
  const d=S.docs.find(x=>x.id===openDoc);if(!d){view="docs";return vDocs()}
  const c=S.clients.find(x=>x.id===d.cid)||{nom:"Client supprimé",info:""};
  const F=d.type==="facture",ht=total(d),tv=d.tva||0,tx=ht*tv/100,tt=ht+tx,sb=sub(d),rm=sb-ht,ac=d.acp||0,fin=ac?Math.max(0,tt-ac):tt;
  const fm=n=>{const r=Math.round(n*100)/100;return r.toLocaleString("fr-FR",{minimumFractionDigits:Number.isInteger(r)?0:2,maximumFractionDigits:2})+" "+esc(S.cur)};
  const ci=[c.adr,[c.tel,c.mail].filter(Boolean).join(" · ")||c.info,c.nif?"NIF : "+c.nif:""].filter(Boolean).map(esc).join("<br>");
  const tr=(a,b,k)=>`<div${k?` class="${k}"`:""}><span>${a}</span><span>${b}</span></div>`;
  const totRows=(rm?tr("Sous-total",fm(sb))+tr("Remise ("+d.rem+" %)","− "+fm(rm)):"")+(tv?tr(rm?"Total HT":"Sous-total HT",fm(ht))+tr("TVA ("+tv+" %)",fm(tx)):"")+(ac?tr(tv?"Total TTC":"Total",fm(tt))+tr("Acompte reçu","− "+fm(ac)):"");
  const br=t=>esc(t).replace(/\n/g,"<br>");
  const rows=d.lines.map(l=>`<tr><td>${esc(l.d)}<span class="sh-sub">${l.q} × ${fm(l.p)}</span></td><td class="r hm">${l.q}</td><td class="r hm">${fm(l.p)}</td><td class="r"><b>${fm(l.q*l.p)}</b></td></tr>`).join("");
  const notes=[d.note,S.cond].filter(Boolean);
  const dueTxt=d.due?(d.due===d.date?"À réception":fdate(d.due)):"";
  const em=[S.adr,S.tel,S.mail,S.nif].filter(Boolean).map(esc).join("<br>");
  return `<div class="noprint tools"><button class="btn alt" data-v="docs">← Retour</button><button class="btn" id="prn">Imprimer / Enregistrer en PDF</button><a class="btn alt" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(docText(d))}">Envoyer par WhatsApp</a><button class="btn alt" data-copy="${d.id}">Copier le texte</button></div>
  <p class="small noprint" style="margin:0 0 14px">Astuce : dans la fenêtre d’impression, choisissez « Enregistrer au format PDF » pour obtenir un fichier à envoyer à votre client.</p>
  ${S.me?"":'<div class="box noprint">Ajoutez le nom et les coordonnées de votre activité dans <b>Réglages</b> pour les voir sur vos documents.</div>'}
  <article class="sheet"><div class="sh-bar"></div><div class="sh-in">
  <div class="sh-head"><div class="sh-brand">${S.logo?`<img class="sh-logo" src="${S.logo}" alt="">`:""}<div class="sh-name">${esc(S.me||"Votre activité")}</div></div>
  <div class="sh-title"><h2>${F?"FACTURE":"DEVIS"}</h2><div class="sh-no">N° ${esc(d.num)}</div><div class="sh-dates"><span>Date</span><b>${fdate(d.date)}</b>${dueTxt?`<span>${F?"Échéance":"Valable jusqu’au"}</span><b>${dueTxt}</b>`:""}${d.ref?`<span>Réf. devis</span><b>${esc(d.ref)}</b>`:""}</div></div></div>
  <div class="sh-parties"><div class="sh-card"><small>Émetteur</small><b>${esc(S.me||"—")}</b>${em?`<br><span class="sh-m">${em}</span>`:""}</div><div class="sh-card"><small>${F?"Facturé à":"Destinataire"}</small><b>${esc(c.nom)}</b>${ci?`<br><span class="sh-m">${ci}</span>`:""}</div></div>
  ${d.obj?`<div class="sh-obj"><small>Objet</small><b>${esc(d.obj)}</b></div>`:""}<table class="sh-t"><thead><tr><th>Désignation</th><th class="r hm">Qté</th><th class="r hm">Prix unitaire</th><th class="r">Montant</th></tr></thead><tbody>${rows}</tbody></table>
  <div class="sh-sum">${F&&d.st==="payé"?`<div class="stamp">PAYÉE<small>${d.paid?"le "+fdate(d.paid):""}</small></div>`:"<span></span>"}<div class="sh-tot">${totRows}<div class="g"><span>${ac?"NET À PAYER":tv?"TOTAL TTC":"TOTAL À PAYER"}</span><span>${fm(fin)}</span></div></div></div>
  ${fin>0&&fin<1e12?`<p class="sh-words">Arrêté ${F?"la présente facture":"le présent devis"} à la somme de : <b>${esc(inWords(fin))}</b>.</p>`:""}
  ${S.pay||notes.length?`<div class="sh-info">${S.pay?`<div class="sh-card"><small>Modalités de paiement</small>${br(S.pay)}</div>`:""}${notes.length?`<div class="sh-card"><small>Notes et conditions</small>${notes.map(t=>br(t)).join("<br>")}</div>`:""}</div>`:""}
  ${!F?`<div class="sh-sign"><div><small>L’émetteur</small></div><div><small>Bon pour accord · date et signature du client</small></div></div>`:""}
  <div class="sh-foot"><b>Merci pour votre confiance.</b>${esc(S.me||"")}</div></div></article>`;
}
const lrow=i=>`<div class="lr"><input type="text" name="l${i}" placeholder="Désignation de la prestation" aria-label="Prestation ${i+1}" ${i?"":"required"}><input type="number" name="q${i}" value="1" min="0" step="any" aria-label="Quantité"><input type="number" name="p${i}" placeholder="Prix unitaire" min="0" step="0.01" aria-label="Prix unitaire"><output class="lt"></output></div>`;
function calcSum(){const f=document.querySelector('form[data-form="doc"]');if(!f)return;let t=0;f.querySelectorAll(".lr").forEach(r=>{const q=parseFloat(r.children[1].value)||0,p=parseFloat(r.children[2].value)||0;t+=q*p;r.children[3].textContent=q*p?fmN(q*p):""});
const rm=Math.min(100,Math.max(0,parseFloat(f.rem.value)||0)),tv=Math.max(0,parseFloat(f.tva.value)||0),ac=Math.max(0,parseFloat(f.acp.value)||0),ht=t*(1-rm/100),tt=ht*(1+tv/100);
document.getElementById("sum").innerHTML=`<div><span>Total HT${rm?" après remise":""}</span><b>${fmN(ht)}</b></div>${tv?`<div><span>TVA ${tv} %</span><b>${fmN(ht*tv/100)}</b></div>`:""}<div class="gt"><span>${ac?"Net à payer":"Total à payer"}</span><b>${fmN(Math.max(0,tt-ac))}</b></div>`}
function vDocs(){
  const ro=S.clients.length?"":"disabled";
  return `<h1>Devis & factures</h1><p class="sub">Créez un document, ouvrez-le en version professionnelle (PDF) et suivez son statut.</p>
  ${S.clients.length?"":'<div class="box">Ajoutez d’abord un client dans la section « Clients ».</div>'}
  <form class="box" data-form="doc"><div class="cform"><select name="type" aria-label="Type"><option value="devis">Devis</option><option value="facture">Facture</option></select>
  <select name="cid" aria-label="Client" required>${S.clients.map(c=>`<option value="${c.id}">${esc(c.nom)}</option>`).join("")}</select>
  <input type="text" name="obj" placeholder="Objet (ex. Création du site vitrine)" aria-label="Objet du document" style="grid-column:1/-1"></div>
  <div class="ln" id="ln">${[0,1,2].map((_,i)=>lrow(i)).join("")}</div>
  <button type="button" class="btn alt sm" data-addln="1" style="margin-top:10px">+ Ajouter une ligne</button>
  <div class="cform" style="margin-top:14px"><label class="fl">Remise (%)<input type="number" name="rem" min="0" max="100" step="any" value="0"></label><label class="fl">TVA (%)<input type="number" name="tva" min="0" max="100" step="any" value="${S.tva||0}"></label><label class="fl">Acompte déjà reçu<input type="number" name="acp" min="0" step="0.01" value="0"></label>
  <label class="fl">Échéance<select name="dl"><option value="0">À réception</option><option value="7">7 jours</option><option value="15" selected>15 jours</option><option value="30">30 jours</option></select></label>
  <input type="text" name="note" placeholder="Note pour ce document (optionnel)" aria-label="Note" style="grid-column:1/-1"></div>
  <div class="sumbox" id="sum"></div>
  <div style="margin-top:14px"><button class="btn" ${ro}>Créer le document</button></div></form>
  <div class="box">${S.docs.length?S.docs.map(d=>`<div class="item"><span class="chip ${d.type}">${d.type}</span><span class="t"><b>${esc(d.num)}</b> · ${esc(cname(d.cid))}<br><span class="small">${esc(d.date)} · ${d.lines.map(l=>esc(l.d)).join(", ")}</span></span><b>${money(ttc(d))}</b>
  <select class="stt s-${d.st==="payé"?"p":d.st==="envoyé"?"e":"b"}" data-st="${d.id}" aria-label="Statut">${STAT.map(s=>`<option ${s===d.st?"selected":""}>${s}</option>`).join("")}</select>
  ${d.type==="devis"?`<button class="btn alt sm" data-conv="${d.id}">En facture</button>`:""}<button class="btn sm" data-open="${d.id}">Aperçu / PDF</button><button class="btn alt sm" data-copy="${d.id}">Copier</button><button class="btn ghost" data-del="docs:${d.id}" aria-label="Supprimer">✕</button></div>`).join(""):'<div class="empty">Aucun document. Créez votre premier devis ci-dessus.</div>'}</div>`;
}

function vTaches(){
  return `<h1>Tâches</h1><p class="sub">Relances, livrables, démarches.</p>
  <form class="box row" data-form="tache"><input type="text" name="txt" placeholder="Que faut-il faire ?" required aria-label="Tâche"><input type="date" name="date" aria-label="Échéance"><button class="btn">Ajouter</button></form>
  <div class="box">${S.taches.length?S.taches.map(t=>`<div class="item ${t.ok?"done":""}"><input type="checkbox" data-chk="${t.id}" ${t.ok?"checked":""} aria-label="Terminée"><span class="t">${esc(t.txt)}</span>${t.date?`<span class="small ${!t.ok&&t.date<today()?"late":""}">${esc(t.date)}</span>`:""}<button class="btn ghost" data-del="taches:${t.id}" aria-label="Supprimer">✕</button></div>`).join(""):'<div class="empty">Aucune tâche. Notez la prochaine relance client.</div>'}</div>`;
}

const PAY={num:"+228 91 29 43 45",wa:"22891294345",price:"5 000 FCFA"};
function payBody(lock){
  return `<div class="pay-grid">
    <div class="plan"><span class="ribbon">Tout inclus</span><h2>Atelier Freelance</h2><div class="price"><b>${PAY.price}</b><span> / mois</span></div>
      <ul class="feat"><li>Suivi de vos clients et prospects</li><li>Devis et factures numérotés automatiquement</li><li>Liste de tâches</li><li>Tableau de bord de vos revenus</li><li>Données sauvegardées sur votre compte</li></ul>
      <p class="small" style="margin:14px 0 0">Paiement par mobile money · activation après vérification</p></div>
    <div class="box steps"><h2>Comment payer</h2>
      <ol class="st"><li><b>Envoyez ${PAY.price}</b> par mobile money au numéro<br><span class="num">${PAY.num}</span> <button class="btn alt sm" id="cpn">Copier</button></li>
      <li><b>Gardez le code</b> de la transaction reçu par SMS.</li>
      <li><b>Confirmez</b> ci-dessous : votre paiement est vérifié, puis votre compte est activé.</li></ol>
      <form data-form="pay"><div class="row"><input type="text" name="nom" placeholder="Votre nom" required aria-label="Votre nom"><input type="text" name="ref" placeholder="Code de la transaction" required aria-label="Code de la transaction"></div>
      <div style="margin-top:10px"><button class="btn">Confirmer mon paiement</button></div></form>
      ${payLink?`<div style="margin-top:12px"><a class="btn" href="${payLink}" target="_blank" rel="noopener" style="display:inline-block;text-decoration:none">Envoyer la confirmation sur WhatsApp</a></div>`:""}
      ${lock?`<p class="small" style="margin-top:14px">⏳ En attente de paiement. Une fois votre compte activé, appuyez sur le bouton ci-dessous.</p><button class="btn alt" id="refresh">Actualiser mon accès</button>`:""}
    </div></div>`}
function vAbo(){return `<h1>S’abonner</h1><p class="sub">Accès complet à Atelier Freelance, ${PAY.price} par mois.</p>`+payBody(false)}
function vReglages(){
  return `<h1>Réglages</h1><p class="sub">Vos données sont sauvegardées sur votre compte${user?" ("+esc(user.email)+")":""}.</p>
  <div class="box acct"><span class="av lg">${ini(user?user.email:"")}</span><div><b>${esc(user?user.email:"")}</b><br><span class="tag ok">Abonnement actif</span></div></div>
  <div class="box"><h2>Votre activité</h2><div class="row" style="margin-top:10px"><input type="text" id="me" value="${esc(S.me)}" placeholder="Votre nom ou entreprise (en-tête des documents)" aria-label="Votre nom"></div>
  <div class="row" style="margin-top:8px"><input type="text" id="tel" value="${esc(S.tel)}" placeholder="Téléphone" aria-label="Téléphone"><input type="text" id="mail" value="${esc(S.mail)}" placeholder="E-mail professionnel" aria-label="E-mail professionnel"></div>
  <div class="row" style="margin-top:8px"><input type="text" id="adr" value="${esc(S.adr)}" placeholder="Adresse (ville, pays)" aria-label="Adresse"><input type="text" id="nif" value="${esc(S.nif)}" placeholder="N° d’identification (NIF, RCCM…)" aria-label="Numéro d’identification"></div>
  <div class="row" style="margin-top:8px"><label class="small">TVA (%)</label><input type="number" id="tva" value="${S.tva||0}" min="0" max="100" step="any" aria-label="TVA" style="max-width:100px;flex:0 1 100px"><span class="small">Laissez 0 si vous n’êtes pas assujetti.</span></div>
  <div class="row" style="margin-top:8px"><textarea id="pay" rows="2" style="width:100%" placeholder="Modalités de paiement (ex. Mobile Money : +228 …)" aria-label="Modalités de paiement">${esc(S.pay)}</textarea></div>
  <div class="row" style="margin-top:8px"><textarea id="cond" rows="2" style="width:100%" placeholder="Conditions ou mentions (ex. Paiement à réception.)" aria-label="Conditions">${esc(S.cond)}</textarea></div>
  <div class="row" style="margin-top:8px">${S.logo?`<img src="${S.logo}" alt="Logo" style="height:48px;max-width:140px;object-fit:contain;border-radius:8px;background:#fff;padding:4px"><button class="btn ghost" id="logoX">Retirer le logo</button>`:""}<label class="btn alt sm" style="cursor:pointer">${S.logo?"Changer le logo":"Ajouter votre logo"}<input type="file" id="logo" accept="image/*" hidden></label></div>
  <div class="row" style="margin-top:8px"><label class="small">Objectif mensuel</label><input type="number" id="goal" value="${S.goal}" min="0" aria-label="Objectif mensuel" style="max-width:140px;flex:0 1 140px"><label class="small">Devise</label><input type="text" id="cur" value="${esc(S.cur)}" maxlength="6" aria-label="Devise" style="max-width:90px;flex:0 1 90px"></div></div>
  <div class="box"><h2>Données</h2><div class="row" style="margin-top:8px"><button class="btn alt" id="exp">Exporter (JSON)</button><button class="btn alt" id="out">Se déconnecter</button><button class="btn alt" id="rst" style="color:var(--rd)">Tout effacer</button></div></div>`;
}

function docText(d){
  const tv=d.tva||0,ht=total(d);
  return `${d.type.toUpperCase()} ${d.num}\nDate : ${d.date}${d.due?"\n"+(d.type==="facture"?"Échéance : ":"Valable jusqu’au : ")+d.due:""}\n${S.me?"De : "+S.me+"\n":""}Client : ${cname(d.cid)}\n\n`+d.lines.map(l=>`- ${l.d} : ${l.q} × ${l.p.toFixed(2)} ${S.cur} = ${(l.q*l.p).toFixed(2)} ${S.cur}`).join("\n")+(tv?`\n\nSous-total : ${ht.toFixed(2)} ${S.cur}\nTVA ${tv} % : ${(ht*tv/100).toFixed(2)} ${S.cur}`:"")+`\n\nTotal : ${ttc(d).toFixed(2)} ${S.cur}`+(S.pay?`\n\nPaiement : ${S.pay}`:"")+`\n\nMerci pour votre confiance.`;
}
document.addEventListener("click",e=>{
  const b=e.target;
  if(b.id==="exp"){const a=document.createElement("a");a.href="data:application/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(S,null,2));a.download="atelier-freelance.json";a.click();return}
  if(b.id==="eye"){const i=document.getElementById("pw");i.type=i.type==="password"?"text":"password";b.textContent=i.type==="password"?"Afficher":"Masquer";return}
  if(b.id==="out"){sb.auth.signOut();return}
  if(b.id==="refresh"){sb.auth.getSession().then(({data})=>{user=null;loadUser(data.session)});return}
  if(b.id==="cpn"){try{navigator.clipboard.writeText(PAY.num);b.textContent="Numéro copié"}catch(x){b.textContent="Copie impossible"}return}
  if(b.id==="rst"){if(confirm("Effacer toutes vos données ?")){S=def();save();go("accueil")}return}
  if(b.id==="logoX"){S.logo="";save();render();return}
  if(b.id==="prn"){const d=S.docs.find(x=>x.id===openDoc),old=document.title;if(d)document.title=d.num+" - "+cname(d.cid);window.print();setTimeout(()=>{document.title=old},800);return}
  const t=b.closest("[data-v],[data-del],[data-paid],[data-conv],[data-copy],[data-mode],[data-open],[data-addln]");if(!t)return;
  const D=t.dataset;
  if(D.addln){const ln=document.getElementById("ln");const n=ln.children.length;if(n<12){ln.insertAdjacentHTML("beforeend",lrow(n));ln.lastElementChild.querySelector("input").focus()}return}
  if(D.v)go(D.v);
  else if(D.open){openDoc=D.open;go("apercu")}
  else if(D.mode){authMode=D.mode;msg="";render()}
  else if(D.del){const[k,id]=D.del.split(":");S[k]=S[k].filter(x=>x.id!==id);save();render()}
  else if(D.paid){const d=S.docs.find(x=>x.id===D.paid);d.st="payé";d.paid=today();save();render()}
  else if(D.conv){const d=S.docs.find(x=>x.id===D.conv);S.docs.unshift({id:uid(),type:"facture",num:nextNum("facture"),cid:d.cid,lines:d.lines,st:"brouillon",date:today(),due:addDays(today(),15),note:d.note||"",tva:d.tva||0,rem:d.rem||0,obj:d.obj||"",ref:d.num});save();render()}
  else if(D.copy){const d=S.docs.find(x=>x.id===D.copy);try{navigator.clipboard.writeText(docText(d));t.textContent="Copié"}catch(x){t.textContent="Copie impossible"}}
});
document.addEventListener("change",e=>{
  const c=e.target,D=c.dataset;
  if(c.id==="logo"){if(c.files&&c.files[0])readLogo(c.files[0]);return}
  if(D.chk){S.taches.find(t=>t.id===D.chk).ok=c.checked;save();render()}
  else if(D.stage){S.clients.find(x=>x.id===D.stage).stage=c.value;save();render()}
  else if(D.st){const d=S.docs.find(x=>x.id===D.st);d.st=c.value;if(c.value==="payé")d.paid=today();save();render()}
});
document.addEventListener("input",e=>{
  if(e.target.closest&&e.target.closest('form[data-form="doc"]')){calcSum();return}
  const i=e.target.id;
  if(i==="me")S.me=e.target.value;
  else if(["tel","mail","adr","nif","pay","cond"].includes(i))S[i]=e.target.value;
  else if(i==="tva")S.tva=Math.min(100,Math.max(0,parseFloat(e.target.value)||0));
  else if(i==="goal")S.goal=Math.max(0,parseFloat(e.target.value)||0);
  else if(i==="cur")S.cur=e.target.value||"€";
  else return;
  save();
});
document.addEventListener("submit",e=>{
  const f=e.target.dataset.form;if(!f)return;e.preventDefault();
  const d=Object.fromEntries(new FormData(e.target));
  if(f==="auth"){doAuth(d,authMode);return}
  if(f==="pay"){payLink="https://wa.me/"+PAY.wa+"?text="+encodeURIComponent("Bonjour, j’ai payé l’abonnement Atelier Freelance ("+PAY.price+"). Nom : "+d.nom.trim()+". E-mail du compte : "+(user?user.email:"")+". Code de transaction : "+d.ref.trim()+".");render();return}
  if(f==="client"){const t=k=>(d[k]||"").trim();S.clients.unshift({id:uid(),nom:t("nom"),mail:t("mail"),tel:t("tel"),adr:t("adr"),nif:t("nif"),info:[t("mail"),t("tel")].filter(Boolean).join(" · "),stage:"Prospect"})}
  if(f==="tache")S.taches.unshift({id:uid(),txt:d.txt.trim(),date:d.date,ok:false});
  if(f==="doc"){
    const lines=Array.from({length:12},(_,i)=>({d:(d["l"+i]||"").trim(),q:parseFloat(d["q"+i])||0,p:parseFloat(d["p"+i])||0})).filter(l=>l.d);
    if(!lines.length)return;
    const pc=v=>Math.min(100,Math.max(0,parseFloat(v)||0));
    S.docs.unshift({id:uid(),type:d.type,num:nextNum(d.type),cid:d.cid,lines,st:"brouillon",date:today(),due:addDays(today(),parseInt(d.dl,10)||0),note:(d.note||"").trim(),obj:(d.obj||"").trim(),rem:pc(d.rem),tva:pc(d.tva),acp:Math.max(0,parseFloat(d.acp)||0)});
  }
  save();render();
});
render();
