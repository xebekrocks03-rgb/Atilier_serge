<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atelier Freelance – clients, devis, factures, revenus</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--sf:#fff;--ink:#16202b;--mut:#5d6b7a;--ln:#d8dfe6;--ac:#2f5bea;--acs:#e3eaff;--am:#f2b134;--rd:#d1495b;--gn:#2a8f6a;--bt:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11171e;--sf:#1a222c;--ink:#e8edf2;--mut:#93a1b0;--ln:#2c3744;--ac:#7c9cff;--acs:#22304f;--rd:#ff7a8a;--gn:#4cc79b;--bt:#0d1320;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11171e;--sf:#1a222c;--ink:#e8edf2;--mut:#93a1b0;--ln:#2c3744;--ac:#7c9cff;--acs:#22304f;--rd:#ff7a8a;--gn:#4cc79b;--bt:#0d1320;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
h1,h2{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0;line-height:1.15}
h1{font-size:2rem}h2{font-size:1.15rem}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
nav{background:var(--sf);border-right:1px solid var(--ln);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.logo{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:1.35rem;padding:0 10px 16px}
.logo i{display:inline-block;width:12px;height:12px;background:var(--am);border-radius:3px;margin-right:8px;transform:rotate(12deg)}
nav button{all:unset;cursor:pointer;padding:10px 12px;border-radius:8px;color:var(--mut);font-weight:500;display:flex;justify-content:space-between}
nav button:hover{background:var(--bg)}
nav button[aria-current="page"]{background:var(--acs);color:var(--ac);font-weight:600}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
main{padding:32px clamp(16px,4vw,48px);max-width:980px;width:100%}
.sub{color:var(--mut);margin:6px 0 24px}
.box{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:9px 11px;min-width:0}
input[type=text],input[type=number]{flex:1 1 130px}
.btn{background:var(--ac);color:var(--bt);border:0;border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer}
.btn.alt{background:var(--sf);color:var(--ink);border:1px solid var(--ln)}
.btn.sm{padding:5px 10px;font-size:.88rem;font-weight:500}
.btn.ghost{background:transparent;color:var(--mut);border:1px solid var(--ln);padding:5px 10px;font-weight:500}
.btn.ghost:hover{color:var(--rd);border-color:var(--rd)}
.item{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid var(--ln);flex-wrap:wrap}
.item:last-child{border:0}
.t{flex:1 1 180px;min-width:0;overflow-wrap:anywhere}
.done .t{text-decoration:line-through;color:var(--mut)}
.tag{font-size:.8rem;padding:2px 9px;border-radius:99px;background:var(--acs);color:var(--ac);font-weight:600}
.small{color:var(--mut);font-size:.88rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:16px}
.stat b{display:block;font:700 1.7rem "Bricolage Grotesque",sans-serif}
.bar{height:12px;background:var(--bg);border-radius:99px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:var(--gn);border-radius:99px}
.pos{color:var(--gn)}.neg{color:var(--rd)}
.empty{color:var(--mut);padding:18px 4px}
.lines{display:grid;grid-template-columns:3fr 1fr 1fr;gap:8px;width:100%}
.lines input{width:100%}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.col{background:var(--bg);border-radius:10px;padding:10px}
.col h2{font-size:.95rem;margin-bottom:8px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:9px;margin-bottom:8px}
@media (max-width:720px){.app{grid-template-columns:1fr}
nav{position:static;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--ln);padding:10px}
.logo{display:none}nav button{white-space:nowrap;gap:8px}}
.pay{max-width:920px;margin:0 auto;padding:28px clamp(16px,4vw,32px)}
.pay-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.logo2{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:1.25rem}
.logo2 i{display:inline-block;width:12px;height:12px;background:var(--am);border-radius:3px;margin-right:8px;transform:rotate(12deg)}
.pay-hero{text-align:center;margin-bottom:28px}
.pay-hero .sub{max-width:520px;margin:10px auto 0;overflow-wrap:anywhere}
.badge{display:inline-block;background:var(--acs);color:var(--gn);font-weight:600;border-radius:99px;padding:4px 14px;margin-bottom:12px}
.pay-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:16px;align-items:start}
.plan{background:var(--sf);border:1px solid var(--ln);border-top:6px solid var(--ac);border-radius:12px;padding:22px}
.price{margin:10px 0 14px}.price b{font:700 2.4rem "Bricolage Grotesque",sans-serif;color:var(--ac)}.price span{color:var(--mut)}
.feat{list-style:none;margin:0;padding:0}.feat li{padding:7px 0 7px 28px;position:relative;border-top:1px solid var(--ln)}
.feat li::before{content:"✓";position:absolute;left:4px;color:var(--gn);font-weight:700}
.st{margin:10px 0 16px;padding-left:20px}.st li{margin-bottom:10px}
.num{display:inline-block;font:700 1.25rem ui-monospace,monospace;background:var(--acs);color:var(--ac);padding:3px 10px;border-radius:8px;margin:4px 6px 4px 0}
@media (max-width:720px){.pay-grid{grid-template-columns:1fr}}
.app.solo main{max-width:none;padding:0}
.auth{display:grid;grid-template-columns:1.05fr 1fr;min-height:100vh}
.brand{position:relative;overflow:hidden;background:#14213d;color:#fff;padding:40px clamp(24px,5vw,64px);display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.brand h1{font-size:clamp(1.9rem,3.6vw,2.8rem);max-width:520px;color:#fff}
.logo3{font:700 1.3rem "Bricolage Grotesque",sans-serif}
.logo3 i{display:inline-block;width:12px;height:12px;background:var(--am);border-radius:3px;margin-right:8px;transform:rotate(12deg)}
.bl{list-style:none;padding:0;margin:26px 0 0;display:grid;gap:14px;max-width:460px}
.bl li{padding-left:22px;position:relative;color:#c9d3e6}
.bl li::before{content:"";position:absolute;left:0;top:.6em;width:8px;height:8px;background:var(--am);border-radius:2px;transform:rotate(12deg)}
.bl b{color:#fff}
.bsm{color:#9fb0cf;font-size:.92rem;margin:0;position:relative}
.sh{position:absolute;border-radius:28px;pointer-events:none}
.s1{width:260px;height:260px;background:var(--am);opacity:.16;right:-90px;top:-70px;transform:rotate(18deg)}
.s2{width:180px;height:180px;border:3px solid #7c9cff;opacity:.3;right:12%;bottom:-60px;transform:rotate(-14deg)}
.brand>*:not(.sh){position:relative}
.fside{display:flex;align-items:center;justify-content:center;padding:32px clamp(16px,4vw,48px)}
.fcard{width:100%;max-width:420px}
.fcard h2{font-size:1.7rem;margin-bottom:6px}
.fcard input{width:100%;padding:12px 14px;font-size:1rem}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:4px;margin-bottom:26px}
.tabs button{border:0;background:none;padding:10px;border-radius:7px;font-weight:600;color:var(--mut);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--sf);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.lb{display:block;font-weight:600;margin:18px 0 6px;font-size:.92rem}
.pwrap{position:relative}.pwrap input{padding-right:92px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--ac);font-weight:600;cursor:pointer;padding:8px}
.btn.big{width:100%;margin-top:22px;padding:13px;font-size:1.02rem}
.msg{margin:14px 0 0;padding:10px 12px;border-left:4px solid var(--am);background:var(--bg);border-radius:6px;font-size:.92rem;overflow-wrap:anywhere}
.plan{position:relative}
.ribbon{position:absolute;top:16px;right:16px;background:var(--am);color:#16202b;font-weight:700;font-size:.78rem;padding:3px 10px;border-radius:99px}
.brand{background:#14213d;justify-content:flex-start}

:root{--bg:#f3f5fa;--sf:#fff;--ink:#0f1a2b;--mut:#64738a;--ln:#e3e8f1;--ac:#2f5bea;--acs:#e8eeff;--am:#f5b335;--amt:#8a5a00;--rd:#e0455a;--gn:#1f9d6e;--sh:0 1px 2px rgba(15,26,43,.05),0 8px 24px rgba(15,26,43,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1420;--sf:#151f2e;--ink:#e9eef6;--mut:#8fa0b5;--ln:#243247;--ac:#7c9cff;--acs:#1d2c4d;--amt:#f5b335;--rd:#ff7a8a;--gn:#4cc79b;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}}
:root[data-theme="dark"]{--bg:#0d1420;--sf:#151f2e;--ink:#e9eef6;--mut:#8fa0b5;--ln:#243247;--ac:#7c9cff;--acs:#1d2c4d;--amt:#f5b335;--rd:#ff7a8a;--gn:#4cc79b;--sh:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}
h1{font-size:2.1rem;letter-spacing:-.02em}
main{padding-top:36px}
@media (min-width:721px){.app{grid-template-columns:248px 1fr}}
nav{background:linear-gradient(180deg,#14213d 0%,#0d1830 100%);border-right:0;color:#fff}
nav .logo{color:#fff;font-size:1.45rem;padding:4px 10px 22px}
nav button{display:flex;align-items:center;justify-content:flex-start;gap:12px;color:#aebbd6;padding:11px 14px;border-radius:12px;position:relative}
nav button:hover{background:rgba(255,255,255,.07);color:#fff}
nav button[aria-current="page"]{background:linear-gradient(90deg,rgba(245,179,53,.2),rgba(245,179,53,.05));color:#fff}
nav button[aria-current="page"]::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:4px;background:var(--am)}
nav button[aria-current="page"] .ni{color:var(--am)}
.ni{display:grid;place-items:center}
.cnt{margin-left:auto;background:rgba(255,255,255,.14);color:#fff;font-size:.78rem;font-weight:600;border-radius:99px;padding:1px 9px}
.who{margin-top:auto;display:flex;gap:10px;align-items:center;padding:12px;border-radius:14px;background:rgba(255,255,255,.07);min-width:0}
.who>div{min-width:0}.who b{display:block;font-size:.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who span:not(.av){font-size:.76rem;color:#7fe0b6}
.av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#2f5bea,#8a4dff);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.av.lg{width:52px;height:52px;font-size:1.3rem}
.hello{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.btn{background:linear-gradient(135deg,#3b66f0,#2543c4);color:#fff;box-shadow:0 6px 16px rgba(47,91,234,.3);border-radius:10px}
.btn.alt,.btn.ghost{box-shadow:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.alt):not(.ghost){background:var(--ac);color:var(--bt);box-shadow:none}}
:root[data-theme="dark"] .btn:not(.alt):not(.ghost){background:var(--ac);color:var(--bt);box-shadow:none}
.box{border-radius:16px;box-shadow:var(--sh)}
.box h2{margin-bottom:6px}
.item{border-radius:10px;padding:12px 10px}
.item:hover{background:var(--bg)}
input[type=checkbox]{accent-color:var(--ac);width:18px;height:18px}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#14213d 0%,#23408e 62%,#2f5bea 130%);color:#fff;border-radius:22px;padding:28px;margin-bottom:18px;box-shadow:0 16px 36px rgba(31,64,160,.28)}
.hero::after{content:"";position:absolute;right:-50px;top:-60px;width:210px;height:210px;border-radius:36px;background:var(--am);opacity:.2;transform:rotate(18deg)}
.hero>*{position:relative;z-index:1}
.eyebrow{display:block;text-transform:uppercase;letter-spacing:.12em;font-size:.76rem;color:#b9c7ea;font-weight:600}
.big{font:700 clamp(2rem,6vw,3rem) "Bricolage Grotesque",sans-serif;margin:6px 0 2px;overflow-wrap:anywhere}
.hs{color:#c9d5f2;font-size:.95rem}
.hero .bar{height:14px;background:rgba(255,255,255,.18);margin:18px 0 8px}
.hero .bar i{background:linear-gradient(90deg,#f5b335,#ffd98a)}
.hrow{display:flex;justify-content:space-between;color:#dce5fb;font-size:.92rem}
.stat{border-radius:16px;box-shadow:var(--sh);position:relative;overflow:hidden;padding-left:22px}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--ac)}
.s-gn::before{background:var(--gn)}.s-am::before{background:var(--am)}
.stat b{font-size:1.5rem;overflow-wrap:anywhere}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.two .box{margin-bottom:0}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.late{color:var(--rd);font-weight:600}
.chip{font-size:.7rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:4px 10px;border-radius:7px;flex:none}
.chip.devis{background:var(--acs);color:var(--ac)}
.chip.facture{background:rgba(245,179,53,.2);color:var(--amt)}
.stt{font-weight:600;border-radius:99px;padding:6px 12px}
.stt.s-b{color:var(--mut)}
.stt.s-e{background:rgba(245,179,53,.18);color:var(--amt);border-color:transparent}
.stt.s-p{background:rgba(31,157,110,.16);color:var(--gn);border-color:transparent}
.col{border-radius:16px;border-top:5px solid var(--ln);padding:12px}
.c0{border-top-color:#8fa1bd}.c1{border-top-color:var(--am)}.c2{border-top-color:var(--ac)}.c3{border-top-color:var(--gn)}
.col h2{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.col h2 em{font-style:normal;background:var(--sf);border-radius:99px;padding:0 10px;font-size:.82rem;color:var(--mut)}
.card{border-radius:12px;box-shadow:var(--sh);padding:12px}
.cl{display:flex;gap:10px;align-items:center}
.cl b{overflow-wrap:anywhere}
.acct{display:flex;align-items:center;gap:14px}
.tag.ok{background:rgba(31,157,110,.16);color:var(--gn)}
.plan{box-shadow:var(--sh)}
@media (max-width:720px){.who{display:none}nav button{padding:9px 12px}main{padding-top:20px}h1{font-size:1.7rem}}

<body>
<div class="app"><nav id="nav" aria-label="Sections"></nav><main id="main"></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SB_URL="https://pitjolrfodfbxojkhvre.supabase.co",SB_KEY="sb_publishable_Nw2-Jj_QVqX864Gc5Rlxyw_jEN0RUIG";
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const def=()=>({cur:"€",goal:2000,me:"",clients:[],docs:[],taches:[]});
let S=def(),view="accueil",payLink="",user=null,actif=false,ready=false,msg="",tm=null,authMode="in",lastEmail="";
function save(){clearTimeout(tm);tm=setTimeout(async()=>{if(!user||!actif)return;try{const{error}=await sb.from("donnees").upsert({user_id:user.id,data:S,updated_at:new Date().toISOString()});if(error)console.error(error)}catch(x){console.error(x)}},600)}
function vAuth(){const up=authMode==="up";
return `<div class="auth">
<aside class="brand"><div class="bphoto"></div><span class="logo3"><i></i>Atelier Freelance</span>
<div><h1>Votre activité de freelance, enfin bien rangée.</h1>
<ul class="bl"><li><b>Clients</b> suivis de la prospection à la fin de mission</li><li><b>Devis &amp; factures</b> créés en quelques minutes</li><li><b>Revenus</b> visibles d’un coup d’œil</li></ul></div>
<p class="bsm">À partir de ${PAY.price} par mois · paiement par mobile money</p><span class="sh s1"></span><span class="sh s2"></span></aside>
<section class="fside"><div class="fcard">
<div class="tabs" role="tablist"><button type="button" role="tab" aria-selected="${!up}" data-mode="in">Connexion</button><button type="button" role="tab" aria-selected="${up}" data-mode="up">Créer un compte</button></div>

<form data-form="auth"><label class="lb" for="em">Adresse e-mail</label><input id="em" type="email" name="email" required autocomplete="email" value="${esc(lastEmail)}" placeholder="vous@exemple.com">
<label class="lb" for="pw">Mot de passe</label><div class="pwrap"><input id="pw" type="password" name="pw" required minlength="8" autocomplete="${up?"new-password":"current-password"}" placeholder="8 caractères minimum"><button type="button" class="eye" id="eye">Afficher</button></div>
<button class="btn big">${up?"Créer mon compte":"Se connecter"}</button>
${msg?`<p class="msg" role="status">${esc(msg)}</p>`:""}</form>
</div></section></div>`}
function vLock(){
  return `<div class="pay">
  <div class="pay-top"><span class="logo2"><i></i>Atelier Freelance</span><button class="btn ghost" id="out">Se déconnecter</button></div>
  <div class="pay-hero"><span class="badge">Compte créé ✓</span><h1>Dernière étape : activez votre accès</h1><p class="sub">Bienvenue ${esc(user.email)}. Un abonnement mensuel vous donne accès à tout l’outil.</p></div>
  ${payBody(true)}</div>`}
async function doAuth(d,mode){
  lastEmail=d.email;msg="Un instant…";render();
  try{
    if(mode==="up"){const{data,error}=await sb.auth.signUp({email:d.email.trim(),password:d.pw});
      if(error)msg="Inscription impossible : "+error.message;
      else if(!data.session)msg="Compte créé. Vérifiez votre e-mail pour confirmer, puis connectez-vous.";else msg=""}
    else{const{error}=await sb.auth.signInWithPassword({email:d.email.trim(),password:d.pw});msg=error?"E-mail ou mot de passe incorrect.":""}
  }catch(x){msg="Connexion impossible. Vérifiez votre réseau et réessayez."}
  render();
}
async function loadUser(session){
  if(session&&user&&session.user.id===user.id&&actif)return;
  user=session?session.user:null;actif=false;S=def();
  if(user){
    try{
      const a=await sb.from("abonnes").select("actif").eq("user_id",user.id).maybeSingle();
      if(!a.error&&!a.data){try{await sb.from("abonnes").insert({user_id:user.id,email:user.email,actif:false})}catch(x){}}
      actif=!!(a.data&&a.data.actif);
      if(actif){const r=await sb.from("donnees").select("data").eq("user_id",user.id).maybeSingle();S=Object.assign(def(),(r.data&&r.data.data)||{})}
    }catch(x){console.error(x)}
  }
  ready=true;render();
}
sb.auth.onAuthStateChange((ev,session)=>{if(ev==="INITIAL_SESSION"||ev==="SIGNED_IN"||ev==="SIGNED_OUT")setTimeout(()=>loadUser(session),0)});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const today=()=>new Date().toISOString().slice(0,10);
const money=n=>n.toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" "+esc(S.cur);
const total=d=>d.lines.reduce((a,l)=>a+l.q*l.p,0);
const cname=id=>(S.clients.find(c=>c.id===id)||{nom:"Client supprimé"}).nom;
const STAGES=["Prospect","Devis envoyé","En cours","Terminé"];
const STAT=["brouillon","envoyé","payé"];
const SECT=[["accueil","Tableau de bord"],["clients","Clients"],["docs","Devis & factures"],["taches","Tâches"],["abo","S’abonner"],["reglages","Réglages"]];

const IC={accueil:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',clients:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.5c2.6.2 4.2 1.8 4.5 4.5"/>',docs:'<path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5M9 13h7M9 17h7"/>',taches:'<rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M8 12.5l3 3 5-6"/>',abo:'<rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 10h19M6.5 15h4"/>',reglages:'<circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/>'};
const ic=k=>`<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]||""}</svg>`;
const ini=n=>esc(((n||"?").trim()[0]||"?").toUpperCase());
function nav(){
  const n={clients:S.clients.length,docs:S.docs.length,taches:S.taches.filter(t=>!t.ok).length};
  const em=user?user.email:"";
  document.getElementById("nav").innerHTML='<div class="logo"><i></i>Atelier</div>'+SECT.map(([k,l])=>`<button data-v="${k}" ${view===k?'aria-current="page"':""}><span class="ni">${ic(k)}</span><span class="nl">${l}</span>${n[k]?`<span class="cnt">${n[k]}</span>`:""}</button>`).join("")+`<div class="who"><span class="av">${ini(em)}</span><div><b>${esc(em)}</b><span>Abonnement actif</span></div></div>`;
}
function go(v){view=v;render();window.scrollTo(0,0)}
function render(){
  const app=document.querySelector(".app"),mn=document.getElementById("main");
  const gate=!ready?'<p class="empty">Chargement…</p>':!user?vAuth():!actif?vLock():null;
  app.classList.toggle("solo",gate!==null);
  if(gate!==null){mn.innerHTML=gate;return}
  nav();mn.innerHTML=({accueil:vAccueil,clients:vClients,docs:vDocs,taches:vTaches,abo:vAbo,reglages:vReglages})[view]()}

function vAccueil(){
  const m=today().slice(0,7),fa=S.docs.filter(d=>d.type==="facture");
  const rev=fa.filter(d=>d.st==="payé"&&(d.paid||"").slice(0,7)===m).reduce((a,d)=>a+total(d),0);
  const att=fa.filter(d=>d.st==="envoyé").reduce((a,d)=>a+total(d),0);
  const act=S.clients.filter(c=>c.stage==="En cours").length;
  const pct=S.goal>0?Math.min(100,Math.round(rev/S.goal*100)):0;
  const due=fa.filter(d=>d.st==="envoyé");
  const tk=S.taches.filter(t=>!t.ok).sort((a,b)=>(a.date||"9")>(b.date||"9")?1:-1).slice(0,5);

function vDocs(){
  const ro=S.clients.length?"":"disabled";

function vTaches(){

const PAY={num:"+228 91 29 43 45",wa:"22891294345",price:"2 000 FCFA"};
function payBody(lock){
  return `<div class="pay-grid">
    <div class="plan"><span class="ribbon">Tout inclus</span><h2>Atelier Freelance</h2><div class="price"><b>${PAY.price}</b><span> / mois</span></div>
      <ul class="feat"><li>Suivi de vos clients et prospects</li><li>Devis et factures numérotés automatiquement</li><li>Liste de tâches</li><li>Tableau de bord de vos revenus</li><li>Données sauvegardées sur votre compte</li></ul>
      <p class="small" style="margin:14px 0 0">Paiement par mobile money · activation après vérification</p></div>
    <div class="box steps"><h2>Comment payer</h2>
      <ol class="st"><li><b>Envoyez ${PAY.price}</b> par mobile money au numéro<br><span class="num">${PAY.num}</span> <button class="btn alt sm" id="cpn">Copier</button></li>
      <li><b>Gardez le code</b> de la transaction reçu par SMS.</li>
      <li><b>Confirmez</b> ci-dessous : votre paiement est vérifié, puis votre compte est activé.</li></ol>
      <form data-form="pay"><div class="row"><input type="text" name="nom" placeholder="Votre nom" required aria-label="Votre nom"><input type="text" name="ref" placeholder="Code de la transaction" required aria-label="Code de la transaction"></div>
      <div style="margin-top:10px"><button class="btn">Confirmer mon paiement</button></div></form>
      ${payLink?`<div style="margin-top:12px"><a class="btn" href="${payLink}" target="_blank" rel="noopener" style="display:inline-block;text-decoration:none">Envoyer la confirmation sur WhatsApp</a></div>`:""}
      ${lock?`<p class="small" style="margin-top:14px">⏳ En attente de paiement. Une fois votre compte activé, appuyez sur le bouton ci-dessous.</p><button class="btn alt" id="refresh">Actualiser mon accès</button>`:""}
    </div></div>`}
function vAbo(){return `<h1>S’abonner</h1><p class="sub">Accès complet à Atelier Freelance, ${PAY.price} par mois.</p>`+payBody(false)}
function vReglages(){
  return `<h1>Réglages</h1><p class="sub">Vos données sont sauvegardées sur votre compte${user?" ("+esc(user.email)+")":""}.</p>
  <div class="box acct"><span class="av lg">${ini(user?user.email:"")}</span><div><b>${esc(user?user.email:"")}</b><br><span class="tag ok">Abonnement actif</span></div></div>
  <div class="box"><h2>Votre activité</h2><div class="row" style="margin-top:10px"><input type="text" id="me" value="${esc(S.me)}" placeholder="Votre nom ou entreprise (en-tête des documents)" aria-label="Votre nom"></div>
  <div class="row" style="margin-top:8px"><label class="small">Objectif mensuel</label><input type="number" id="goal" value="${S.goal}" min="0" aria-label="Objectif mensuel" style="max-width:140px;flex:0 1 140px"><label class="small">Devise</label><input type="text" id="cur" value="${esc(S.cur)}" maxlength="6" aria-label="Devise" style="max-width:90px;flex:0 1 90px"></div></div>
  <div class="box"><h2>Données</h2><div class="row" style="margin-top:8px"><button class="btn alt" id="exp">Exporter (JSON)</button><button class="btn alt" id="out">Se déconnecter</button><button class="btn alt" id="rst" style="color:var(--rd)">Tout effacer</button></div></div>`;
}

function docText(d){
  return `${d.type.toUpperCase()} ${d.num}\nDate : ${d.date}\n${S.me?"De : "+S.me+"\n":""}Client : ${cname(d.cid)}\n\n`+d.lines.map(l=>`- ${l.d} : ${l.q} × ${l.p.toFixed(2)} ${S.cur} = ${(l.q*l.p).toFixed(2)} ${S.cur}`).join("\n")+`\n\nTotal : ${total(d).toFixed(2)} ${S.cur}`;
}
document.addEventListener("click",e=>{
  const b=e.target;
  if(b.id==="exp"){const a=document.createElement("a");a.href="data:application/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(S,null,2));a.download="atelier-freelance.json";a.click();return}
  if(b.id==="eye"){const i=document.getElementById("pw");i.type=i.type==="password"?"text":"password";b.textContent=i.type==="password"?"Afficher":"Masquer";return}
  if(b.id==="out"){sb.auth.signOut();return}
  if(b.id==="refresh"){sb.auth.getSession().then(({data})=>{user=null;loadUser(data.session)});return}
  if(b.id==="cpn"){try{navigator.clipboard.writeText(PAY.num);b.textContent="Numéro copié"}catch(x){b.textContent="Copie impossible"}return}
  if(b.id==="rst"){if(confirm("Effacer toutes vos données ?")){S=def();save();go("accueil")}return}
  const t=b.closest("[data-v],[data-del],[data-paid],[data-conv],[data-copy],[data-mode]");if(!t)return;
  const D=t.dataset;
  if(D.v)go(D.v);
  else if(D.mode){authMode=D.mode;msg="";render()}
  else if(D.del){const[k,id]=D.del.split(":");S[k]=S[k].filter(x=>x.id!==id);save();render()}
  else if(D.paid){const d=S.docs.find(x=>x.id===D.paid);d.st="payé";d.paid=today();save();render()}
  else if(D.conv){const d=S.docs.find(x=>x.id===D.conv);const n=S.docs.filter(x=>x.type==="facture").length+1;S.docs.unshift({id:uid(),type:"facture",num:"FA-"+String(n).padStart(3,"0"),cid:d.cid,lines:d.lines,st:"brouillon",date:today()});save();render()}
  else if(D.copy){const d=S.docs.find(x=>x.id===D.copy);try{navigator.clipboard.writeText(docText(d));t.textContent="Copié"}catch(x){t.textContent="Copie impossible"}}
});
document.addEventListener("change",e=>{
  const c=e.target,D=c.dataset;
  if(D.chk){S.taches.find(t=>t.id===D.chk).ok=c.checked;save();render()}
  else if(D.stage){S.clients.find(x=>x.id===D.stage).stage=c.value;save();render()}
  else if(D.st){const d=S.docs.find(x=>x.id===D.st);d.st=c.value;if(c.value==="payé")d.paid=today();save();render()}
});
document.addEventListener("input",e=>{
  const i=e.target.id;
  if(i==="me")S.me=e.target.value;
  else if(i==="goal")S.goal=Math.max(0,parseFloat(e.target.value)||0);
  else if(i==="cur")S.cur=e.target.value||"€";
  else return;
  save();
});
document.addEventListener("submit",e=>{
  const f=e.target.dataset.form;if(!f)return;e.preventDefault();
  const d=Object.fromEntries(new FormData(e.target));
  if(f==="auth"){doAuth(d,authMode);return}
  if(f==="pay"){payLink="https://wa.me/"+PAY.wa+"?text="+encodeURIComponent("Bonjour, j’ai payé l’abonnement Atelier Freelance ("+PAY.price+"). Nom : "+d.nom.trim()+". E-mail du compte : "+(user?user.email:"")+". Code de transaction : "+d.ref.trim()+".");render();return}
  if(f==="client")S.clients.unshift({id:uid(),nom:d.nom.trim(),info:d.info.trim(),stage:"Prospect"});
  if(f==="tache")S.taches.unshift({id:uid(),txt:d.txt.trim(),date:d.date,ok:false});
  if(f==="doc"){
    const lines=[0,1,2].map(i=>({d:(d["l"+i]||"").trim(),q:parseFloat(d["q"+i])||0,p:parseFloat(d["p"+i])||0})).filter(l=>l.d);
    if(!lines.length)return;
    const n=S.docs.filter(x=>x.type===d.type).length+1;
    S.docs.unshift({id:uid(),type:d.type,num:(d.type==="devis"?"DV-":"FA-")+String(n).padStart(3,"0"),cid:d.cid,lines,st:"brouillon",date:today()});
  }
  save();render();
});
render();
</script>
</body>
</html>
